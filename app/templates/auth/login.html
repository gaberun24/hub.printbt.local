{% extends "base.html" %}

{% block body %}
<main class="auth-shell">
  <div class="auth-card">
    <h1 class="auth-title">Hub</h1>
    <p class="auth-lead">Belépés a belső rendszerbe.</p>

    {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <label class="form-label">
        <span>Email</span>
        <input type="email" name="email" value="{{ email }}" required autofocus>
      </label>
      <label class="form-label">
        <span>Jelszó</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">Belépés</button>
    </form>
  </div>
</main>
{% endblock %}
