{% extends "base.html" %}

{% block body %}
<main class="auth-shell">
  <div class="auth-card">
    <div class="auth-brand">Hub</div>
    <h1 class="auth-title">Belépés</h1>
    <p class="auth-lead">Belső rendszer — csak céges hálón érhető el.</p>

    {% if error %}
      <div class="auth-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <label class="field">
        <span class="field-label">Email</span>
        <input type="email" name="email" value="{{ email }}" required autofocus>
      </label>
      <label class="field">
        <span class="field-label">Jelszó</span>
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-submit">Belépés</button>
    </form>
  </div>
</main>
{% endblock %}
