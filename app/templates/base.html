<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title|default("Hub") }} — Hub</title>
  {# FOUC-prevention: téma beállítása MIELŐTT a CSS-t parsolnánk, hogy ne legyen
     fehér-villanás dark mode-ban. Inline + sync, nem külső .js fájl. #}
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("hub-theme");
        var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) { /* localStorage blokkolva — light marad */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..900,0..100&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
  <script src="{{ url_for('static', path='js/theme_toggle.js') }}" defer></script>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
