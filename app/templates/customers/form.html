{% extends "app.html" %}

{% block topbar_action %}
  <a href="{% if customer %}/customers/{{ customer.id }}{% else %}/customers{% endif %}" class="btn">Mégsem</a>
{% endblock %}

{% block main %}
<h1 class="greeting" style="margin-bottom: 4px;">
  {% if customer %}Ügyfél <em>szerkesztése</em>{% else %}Új <em>ügyfél</em>{% endif %}
</h1>
<div class="greeting-date">retail vagy reseller · név kötelező</div>

{% if error %}
  <div class="auth-error" role="alert" style="margin-top: 16px; max-width: 720px;">{{ error }}</div>
{% endif %}

<form method="post"
      action="{% if customer %}/customers/{{ customer.id }}/update{% else %}/customers/new{% endif %}"
      style="max-width: 720px; margin-top: 24px;">

  {% if next_url %}
    <input type="hidden" name="next" value="{{ next_url }}">
  {% endif %}

  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">Alapadatok</div>
    </div>
    <div class="panel-body">
      <div class="form-group">
        <label class="form-label">Név</label>
        <input class="form-input" name="name" value="{{ customer.name if customer else '' }}" required
               placeholder="Pl. Pelikán Kft.">
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input class="form-input" name="email" type="email" value="{{ customer.email if customer else '' }}"
                 placeholder="info@pelikan.hu">
        </div>
        <div class="form-group">
          <label class="form-label">Telefon</label>
          <input class="form-input" name="phone" value="{{ customer.phone if customer else '' }}"
                 placeholder="+36 70 123 4567">
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Típus</label>
          <select class="form-input" name="customer_type" id="customer_type">
            <option value="retail" {% if not customer or customer.customer_type == 'retail' %}selected{% endif %}>Retail (lakossági)</option>
            <option value="reseller" {% if customer and customer.customer_type == 'reseller' %}selected{% endif %}>Reseller (B2B)</option>
          </select>
        </div>
        <div class="form-group" id="discount-field"
             {% if not customer or customer.customer_type != 'reseller' %}style="display:none"{% endif %}>
          <label class="form-label">Reseller kedvezmény (%)</label>
          <input class="form-input" name="discount_pct" type="number" min="0" max="50"
                 value="{{ customer.discount_pct if customer and customer.discount_pct else '' }}"
                 placeholder="Pl. 15">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Belső megjegyzés (opcionális)</label>
        <textarea class="form-textarea" name="notes" placeholder="Pl. 'régi ügyfél, mindig sürgős'">{{ customer.notes if customer else '' }}</textarea>
      </div>
    </div>
  </div>

  <div class="action-bar">
    <button type="submit" class="btn btn-accent">
      {% if customer %}Mentés{% else %}Ügyfél létrehozása{% endif %}
    </button>
    <a href="{% if customer %}/customers/{{ customer.id }}{% else %}/customers{% endif %}" class="btn btn-ghost">Mégsem</a>
  </div>
</form>

<script>
  // Reseller-kedvezmény mező show/hide a customer_type alapján
  (function () {
    var sel = document.getElementById('customer_type');
    var field = document.getElementById('discount-field');
    if (!sel || !field) return;
    sel.addEventListener('change', function () {
      field.style.display = sel.value === 'reseller' ? '' : 'none';
    });
  })();
</script>
{% endblock %}
