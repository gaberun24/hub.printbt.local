# Hub nginx site — belső LAN, sima HTTP (nincs publikus URL).
# Fájl: /etc/nginx/sites-available/hub.conf
# Engedélyezés: ln -s /etc/nginx/sites-available/hub.conf /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Belső használat — minden host-ra felel a LAN-on
    server_name _;

    # Email csatolmányok és nagyobb feltöltések miatt nagyobb body
    client_max_body_size 50M;

    # Statikus assetek közvetlenül nginxről (gyorsabb, mint az appon át)
    location /static/ {
        alias /opt/hub/app/app/static/;
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
    }

    # Az /uploads-on jobb, ha az app védi (jogosultságok!) — proxy_pass
    # Ha későbbi optimalizálásnál direktben akarod kiszolgálni, kapcsold át
    # `internal;` + `X-Accel-Redirect`-re.

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Hosszabb műveletekhez (PDF generálás, IMAP teszt)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # /health endpoint — direkt logolás nélkül (ne szemeteljünk a logon)
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080/health;
    }
}
